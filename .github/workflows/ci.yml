name: Validate Restaurant Platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npx tsc -p tsconfig.edge.json
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://wanrzgumoamryuybmopa.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_pZMuAvmUkmdmV9SFhHWj1A_vjL5c_wN
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm run check:edge
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - name: Verify CLI packaging against localhost (no cloud token)
        run: node scripts/check-edge-package.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: platform-build-review
          path: dist/
          retention-days: 7
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-review
          path: |
            playwright-report/
            test-results/
          retention-days: 7
