name: Deploy Supabase Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-edge-wanrzgumoamryuybmopa
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_TELEMETRY_DISABLED: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: supabase/setup-cli@v1
        with:
          version: 2.122.0
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Install validation dependencies
        run: npm ci --no-audit --no-fund
      - name: Validate Edge imports and types
        run: npm run check:edge
      - name: Verify runtime keys and scoped Sanity write protection
        run: npx vitest run tests/edge-environment.test.ts tests/sanity-write-safety.test.ts tests/sanity-production-policy.test.ts tests/editor.test.ts
      - name: Check CLI source packages against localhost only
        run: node scripts/check-edge-package.mjs
      - name: Deploy content only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo 'Falta el secreto SUPABASE_ACCESS_TOKEN'; exit 1; }
          supabase functions deploy content --project-ref wanrzgumoamryuybmopa --use-api --no-verify-jwt --import-map supabase/functions/deno.json
      - name: Deploy platform-admin only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy platform-admin --project-ref wanrzgumoamryuybmopa --use-api --no-verify-jwt --import-map supabase/functions/deno.json
      - name: Record scope of completed commands
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'SUMMARY'
          Se completaron los comandos para **content** y **platform-admin** en `wanrzgumoamryuybmopa`.
          CLI: `2.122.0`; `verify_jwt=false`; import map: `supabase/functions/deno.json`.
          Cada función verifica la sesión con `auth.getUser`. Las escrituras Sanity admiten `staging` y únicamente la tupla de Salitre configurada explícitamente para `hfa8zkyw/production`.
          No se ejecutaron migraciones, bootstrap ni despliegues de webs.
          Revisa ambas funciones en Supabase y valida el acceso desde el dashboard; el éxito de la CLI no acredita por sí solo el recorrido remoto completo.
          SUMMARY
