name: Configure Salitre production (manual)
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect only, or configure the exact existing Salitre integration
        required: true
        type: choice
        options: [inspect, apply]
        default: inspect
      expected_restaurant_id:
        description: Exact restaurant UUID obtained from inspect (apply only)
        type: string
      expected_integration_id:
        description: Exact existing integration UUID obtained from inspect (apply only)
        type: string
      confirmation:
        description: Apply only — HABILITAR SALITRE PRODUCTION
        type: string
permissions:
  contents: read
concurrency:
  group: supabase-edge-wanrzgumoamryuybmopa
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main' && github.repository == 'EduardoCR90/restaurant-platform-dashboard' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify safe configuration with synthetic data
        run: node --test scripts/salitre-production.test.mjs
      - name: Inspect or configure existing Salitre only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SALITRE_OPERATION: ${{ inputs.operation }}
          EXPECTED_RESTAURANT_ID: ${{ inputs.expected_restaurant_id }}
          EXPECTED_INTEGRATION_ID: ${{ inputs.expected_integration_id }}
          SALITRE_CONFIRMATION: ${{ inputs.confirmation }}
        run: node scripts/salitre-production.mjs
