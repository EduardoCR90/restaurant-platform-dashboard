name: Diagnose provisioning (read-only)

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Existing provisioning UUID or Edge log request UUID
        required: false
        type: string
      restaurant_slug:
        description: Exact restaurant slug when the request UUID is unavailable
        required: false
        type: string
      failed_at_utc:
        description: Failure timestamp in ISO UTC used for a bounded fallback lookup
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-provisioning-${{ inputs.request_id || inputs.restaurant_slug }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.repository == 'EduardoCR90/restaurant-platform-dashboard' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate diagnostic safety
        run: node --test scripts/diagnose-provisioning.test.mjs
      - name: Inspect existing request and required secret names only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROVISIONING_REQUEST_ID: ${{ inputs.request_id }}
          PROVISIONING_RESTAURANT_SLUG: ${{ inputs.restaurant_slug }}
          PROVISIONING_FAILED_AT_UTC: ${{ inputs.failed_at_utc }}
        run: node scripts/diagnose-provisioning.mjs
