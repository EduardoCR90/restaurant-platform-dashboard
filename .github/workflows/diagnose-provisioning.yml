name: Diagnose provisioning (read-only)

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/diagnose-provisioning.yml
  workflow_dispatch:
    inputs:
      request_id:
        description: Existing provisioning UUID or Edge log request UUID
        required: true
        type: string
      failed_at_utc:
        description: Failure timestamp in ISO UTC used for a bounded fallback lookup
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-provisioning-${{ inputs.request_id || '594ef199-3f83-4d3d-9ffd-4fcc87f2c471' }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.repository == 'EduardoCR90/restaurant-platform-dashboard' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate diagnostic safety
        run: node --test scripts/diagnose-provisioning.test.mjs
      - name: Inspect existing request and required secret names only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROVISIONING_REQUEST_ID: ${{ inputs.request_id || '594ef199-3f83-4d3d-9ffd-4fcc87f2c471' }}
          PROVISIONING_FAILED_AT_UTC: ${{ inputs.failed_at_utc || '2026-11-04T13:25:29Z' }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/diagnose-provisioning.mjs
          else
            node --input-type=module <<'NODE'
          import {
            diagnoseProvisioning,
            DiagnosticFailure,
            managementApi,
          } from './scripts/diagnose-provisioning.mjs';
          try {
            const result = await diagnoseProvisioning(
              process.env.PROVISIONING_REQUEST_ID,
              managementApi(process.env.SUPABASE_ACCESS_TOKEN),
              {failedAtUtc: process.env.PROVISIONING_FAILED_AT_UTC},
            );
            console.log(JSON.stringify(result));
          } catch (error) {
            console.error(
              error instanceof DiagnosticFailure
                ? error.message
                : error?.message?.startsWith('Diagnóstico rechazado (HTTP ')
                  ? error.message
                  : 'Diagnóstico detenido: no se muestran secretos, filas completas ni respuestas privadas.',
            );
            process.exitCode = 1;
          }
          NODE
          fi
