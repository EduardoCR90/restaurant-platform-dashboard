name: Diagnose provisioning (read-only)

on:
  workflow_dispatch:
    inputs:
      request_id:
        description: Existing complete provisioning request UUID
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: diagnose-provisioning-${{ inputs.request_id }}
  cancel-in-progress: false

jobs:
  inspect:
    if: github.ref == 'refs/heads/main' && github.repository == 'EduardoCR90/restaurant-platform-dashboard' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate diagnostic safety
        run: node --test scripts/diagnose-provisioning.test.mjs
      - name: Inspect existing request and required secret names only
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROVISIONING_REQUEST_ID: ${{ inputs.request_id }}
        run: node scripts/diagnose-provisioning.mjs
