name: Configure platform governance (manual)
on:
  workflow_call:
    inputs:
      operation:
        type: string
        required: true
      validated_sha:
        type: string
        required: true
    secrets:
      SUPABASE_ACCESS_TOKEN:
        required: true
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect or apply reviewed platform metadata, permissions and provisioning schema
        type: choice
        options: [inspect, apply]
        default: inspect
        required: true
permissions:
  contents: read
concurrency:
  group: supabase-edge-wanrzgumoamryuybmopa
  cancel-in-progress: false
jobs:
  configure:
    if: github.ref == 'refs/heads/main' && github.repository == 'EduardoCR90/restaurant-platform-dashboard' && github.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          ref: ${{ inputs.validated_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run tests/template-governance-db.test.ts tests/sanity-provisioning-db.test.ts tests/editor.test.ts tests/sanity-production-policy.test.ts
      - run: node --test scripts/configure-template-governance.test.mjs
      - name: Apply reviewed additive platform metadata and permission policy
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          GOVERNANCE_OPERATION: ${{ inputs.operation }}
          GOVERNANCE_VALIDATED_SHA: ${{ inputs.validated_sha || github.sha }}
        run: node scripts/configure-template-governance.mjs
